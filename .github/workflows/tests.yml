name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Force a headless matplotlib backend so figure-rendering tests never try to
    # open a display on the runner. TEST_SH_MAX caps pytest-xdist at one worker so
    # the multi-GB/worker reference matrices can't OOM-kill the runner.
    env:
      MPLBACKEND: Agg
      TEST_SH_MAX: "1"
    strategy:
      # Report every Python version's result rather than cancelling the matrix
      # on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyensembl is pulled in transitively by pirlygenes (not a direct
          # trufflepig dependency); the [test] extra adds pytest/xdist/httpx/etc.
          pip install -e ".[test]"

      - name: Run lint checks
        run: bash lint.sh

      - name: Resolve pirlygenes data-bundle version
        id: pirlygenes-data
        # The bundle lives in a DATA_VERSION-stamped dir (bundled_data/v{DATA_VERSION}),
        # and DATA_VERSION is decoupled from both the pip version and the pyproject
        # floor. Emit the RESOLVED value so the cache key below tracks it directly.
        run: |
          echo "version=$(python -c 'import pirlygenes.data_bundle as d; print(d.DATA_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Cache pyensembl data
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyensembl/
          key: pyensembl-75-81-114-115-${{ runner.os }}

      - name: Cache pirlygenes data bundle
        # The ~350 MB pirlygenes reference bundle (pan-cancer-expression etc.) is
        # fetched on demand from the pinned GitHub release the first time a test
        # loads a reference matrix. Cache it so it downloads once, not per matrix
        # job / per run. Key on the RESOLVED DATA_VERSION (not pyproject): an
        # upstream pirlygenes release that bumps DATA_VERSION without any pyproject
        # edit then misses the stale key and re-saves the new bundle, instead of a
        # stale-key restore hit that never re-persists and silently re-downloads
        # ~350 MB on every subsequent run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pirlygenes/
          key: pirlygenes-data-v${{ steps.pirlygenes-data.outputs.version }}-${{ runner.os }}

      - name: Install Ensembl genome data
        run: |
          # trufflepig resolves gene IDs against every installed Ensembl release
          # and loads pirlygenes' cancer-reference-expression aggregate, whose
          # source cohorts span historical and current annotation vintages.
          # Releases 114 and 115 cover IDs introduced by the current reference
          # bundle; releases 75 and 81 retain IDs from legacy cohorts.
          # Release 75 is also the fixed vintage used by the aneuploidy
          # chromosome-arm gene map.
          pyensembl install --release 115 --species homo_sapiens
          pyensembl install --release 114 --species homo_sapiens
          pyensembl install --release 81 --species homo_sapiens
          pyensembl install --release 75 --species homo_sapiens
          # Fail fast if a release didn't materialize — otherwise the dependent
          # tests would silently *skip* and CI would go green without them.
          python -c "from pyensembl import EnsemblRelease; releases = (75, 81, 114, 115); assert all(EnsemblRelease(r).genes_by_name('TP53') for r in releases); print(f'Ensembl releases {releases} ready')"

      - name: Run unit tests
        # test.sh sizes pytest-xdist workers from the runner's CPU + free RAM
        # (Linux branch reads /proc/meminfo), so it stays within the runner's
        # memory budget without a hand-tuned -n.
        run: bash test.sh -q
