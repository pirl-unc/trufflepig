[project]
name = "pirl-trufflepig"
requires-python = ">=3.9"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "RNA tumor analysis driven by pirlygenes gene sets. Migrates the pirlygenes analyze pipeline into composable sub-commands with serializable intermediate state for incremental website-style runs."
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # >=5.23.45: pairwise cancer-type discriminators carry an explicit
    # hypothesis-only, contradiction-safe promotion policy. Trufflepig consumes
    # that policy instead of treating pairwise evidence as a global classifier.
    "pirlygenes>=5.23.45,<6",
    # oncoref is the canonical cancer-type ontology + normalization source (imported
    # unconditionally by cancer_ontology / clean_tpm / expression_normalize /
    # expression_classifier). Without it declared, a clean install raises
    # ModuleNotFoundError before the pirlygenes ontology fallback can run.
    # >=1.8.136: compact all-source availability lets raw TPM read only the
    # requested per-source shards instead of materializing the 5M-row union.
    "oncoref>=1.8.136,<2",
    "numpy>=2.0.0",
    # Cap below pandas 3: the suite is written against pandas 2.x and does not yet
    # support the 3.0 breaking changes (Copy-on-Write by default, the object-dtype
    # fillna downcast change, removed legacy APIs). Without this cap a fresh
    # `pip install` resolves pandas 3.x and breaks at import/runtime. Lifting the
    # cap is a deliberate pandas-3 migration, tracked separately.
    "pandas>=2.0,<3",
    "matplotlib>=3.5.0",
    # scipy (nnls background subtraction, spearman, rankdata) and scikit-learn
    # (the learned expression classifier) are core runtime deps; seaborn and
    # adjustText are imported at module top in the plotting modules. All four
    # were undeclared and only resolved locally via unrelated packages — a clean
    # `pip install` raised ModuleNotFoundError for them (caught by CI).
    # Floors are the first releases with numpy-2 support (this project already
    # requires numpy>=2.0.0), so the declared minimum matches what pip can
    # actually resolve rather than a lower version that would silently pull an
    # ABI-incompatible build if the numpy floor were ever relaxed.
    "scipy>=1.13",
    "scikit-learn>=1.4.2",
    "seaborn>=0.13.2",
    "adjustText>=0.8",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.dynamic]
version = {attr = "trufflepig.version.__version__"}

[tool.setuptools]
packages = [
    "trufflepig",
    "trufflepig.analyze",
    "trufflepig.decomposition",
    "trufflepig.stages",
    "trufflepig.web",
]

[tool.setuptools.package-data]
trufflepig = ["py.typed", "data/*.csv", "data/*.csv.gz", "web/static/*", "web/templates/*"]


[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
    "markdown>=3.4",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff>=0.12,<1",
    "httpx",
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "markdown>=3.4",
]

[project.scripts]
trufflepig = "trufflepig.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep the initial baseline focused on correctness and ordinary Python style.
# Import ordering predates Ruff adoption and can be normalized separately;
# several modules also intentionally defer imports until after runtime setup.
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep direct/IDE pytest launches serial.  test.sh is the only supported place
# that enables xdist, after sizing workers against live RAM and taking the
# cross-process suite lock.  A root conftest guard rejects unsafe overrides.
markers = [
    "perf: performance-regression fences",
]
