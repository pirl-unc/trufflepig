[project]
name = "pirl-trufflepig"
requires-python = ">=3.11"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "RNA tumor analysis, therapeutic evidence, and decision-aligned reports driven by pirlygenes gene sets."
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # >=6.4.0: adopts OncoRef 1.52+ active CTA target_selection policy, 4-way
    # CTA sex partition (CTA-M/CTA-F/CTA-MF/CTA-P), and manifest provenance,
    # building on typed NUT-family therapy eligibility, the public
    # cohort-expression matrix contract, direct VSCC/MENINGIOMA/THYMCA
    # references, fail-closed source rollups, and owner-delegated driver
    # evidence.
    "pirlygenes>=6.4.0,<7",
    # oncoref is the canonical cancer-type ontology + normalization source (imported
    # unconditionally by cancer_ontology / clean_tpm / expression_normalize /
    # expression_classifier). Without it declared, a clean install raises
    # ModuleNotFoundError before the pirlygenes ontology fallback can run.
    # >=1.52.0: active target_selection CTA policy, 4-way CTA-P sex partition,
    # direct THYMCA reference, compact all-source availability, acquisition
    # provenance, complete-union classification policy, tumor-reference
    # accessors, and audited ICI/aPD1/TMB evidence resolution aligned with
    # pirlygenes 6.4+.
    "oncoref>=1.52.0,<2",
    "numpy>=2.0.0",
    "pandas>=3,<4",
    "matplotlib>=3.5.0",
    "Pillow>=9.1",
    "mhcgnomes>=3.64.1,<4",
    "markdown-it-py>=3,<5",
    "Jinja2>=3.1.6,<4",
    "reportlab>=4.4,<6",
    "pypdf>=5,<7",
    # scipy (nnls background subtraction, spearman, rankdata) and scikit-learn
    # (the learned expression classifier) are core runtime deps; seaborn and
    # adjustText are imported at module top in the plotting modules. All four
    # were undeclared and only resolved locally via unrelated packages — a clean
    # `pip install` raised ModuleNotFoundError for them (caught by CI).
    # Floors are the first releases with numpy-2 support (this project already
    # requires numpy>=2.0.0), so the declared minimum matches what pip can
    # actually resolve rather than a lower version that would silently pull an
    # ABI-incompatible build if the numpy floor were ever relaxed.
    "scipy>=1.13",
    "scikit-learn>=1.4.2",
    "seaborn>=0.13.2",
    "adjustText>=0.8",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.dynamic]
version = {attr = "trufflepig.version.__version__"}

[tool.setuptools]
packages = [
    "trufflepig",
    "trufflepig.analyze",
    "trufflepig.decomposition",
    "trufflepig.web",
]

[tool.setuptools.package-data]
trufflepig = ["py.typed", "data/*.csv", "data/*.csv.gz", "data/*.txt.gz", "data/LICENCE-*.md", "report_templates/*.j2", "web/static/*", "web/templates/*"]


[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
    "markdown>=3.4",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff>=0.12,<1",
    "httpx",
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "markdown>=3.4",
]

[project.scripts]
trufflepig = "trufflepig.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the initial baseline focused on correctness and ordinary Python style.
# Import ordering predates Ruff adoption and can be normalized separately;
# several modules also intentionally defer imports until after runtime setup.
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep direct/IDE pytest launches serial.  test.sh is the only supported place
# that enables xdist, after sizing workers against live RAM and taking the
# cross-process suite lock.  A root conftest guard rejects unsafe overrides.
markers = [
    "perf: performance-regression fences",
]
