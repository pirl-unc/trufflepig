[project]
name = "trufflepig"
requires-python = ">=3.9"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "RNA tumor analysis driven by pirlygenes gene sets. Migrates the pirlygenes analyze pipeline into composable sub-commands with serializable intermediate state for incremental website-style runs."
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pirlygenes>=5.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0",
    "matplotlib>=3.5.0",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.dynamic]
version = {attr = "trufflepig.version.__version__"}

[tool.setuptools]
packages = [
    "trufflepig",
    "trufflepig.analyze",
    "trufflepig.decomposition",
    "trufflepig.stages",
]

[tool.setuptools.package-data]
trufflepig = ["py.typed"]


[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[project.scripts]
trufflepig = "trufflepig.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "perf: performance-regression fences",
]
